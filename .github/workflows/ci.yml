name: shire-guard backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    # sqlx::query! 매크로는 컴파일할 때 SQL을 검사하며, 기본적으로 DATABASE_URL로 DB에 접속함
    # CI에는 DB가 없으므로 오프라인 모드로 설정해 backend/.sqlx/ 에 저장된 검사 결과를 사용함
    # .sqlx/ 는 로컬에서 `cargo sqlx prepare -- --all-targets` 로 생성해 커밋함
    # (쿼리를 수정하면 로컬에서 prepare를 다시 실행하고 커밋해야 하며, 안 하면 CI가 실패함)
    env:
      SQLX_OFFLINE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        run: cargo fmt --check
        working-directory: backend

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: backend

      - name: Cargo build
        run: cargo build
        working-directory: backend

      - name: Cargo test
        run: cargo test --lib
        working-directory: backend