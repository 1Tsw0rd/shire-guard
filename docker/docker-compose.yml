name: shire-guard

networks:
  shire-net:
    driver: bridge

include:
  - docker-compose.ollama.yml
  - docker-compose.vector.yml
  - docker-compose.kafka.yml
  # - docker-compose.redpanda.yml
  - docker-compose.opensearch.yml
  - docker-compose.clickhouse.yml
  - docker-compose.grafana.yml
  - docker-compose.postgres.yml
  - docker-compose.redis.yml
  # - docker-compose.dragonfly.yml
  - docker-compose.prometheus.yml
  - docker-compose.cadvisor.yml
  
# ── 포트 매핑 참고 (호스트:컨테이너) ──────────────────────────────
# 가변:가변 → 컨테이너 내부 포트도 환경변수로 실제로 바뀜 (.env 값 변경 시 양쪽 다 반영)
#   Kafka    : ${KAFKA_PORT}:${KAFKA_PORT} (내부용), ${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT} (호스트용)
#   Ollama   : ${OLLAMA_PORT}:${OLLAMA_PORT}
#   Vector   : ${VECTOR_PORT}:${VECTOR_PORT}, ${VECTOR_API_PORT}:${VECTOR_API_PORT}
#
# 가변:고정 → 현재 Compose에서는 컨테이너 내부 포트를 기본값으로 고정
#   PostgreSQL              : ${POSTGRES_PORT}:5432
#   Redis                   : ${REDIS_PORT}:6379
#   Dragonfly               : ${DRAGONFLY_PORT}:6379
#   Grafana                 : ${GRAFANA_PORT}:3000
#   OpenSearch              : ${OPENSEARCH_PORT}:9200, ${OPENSEARCH_PERF_PORT}:9600
#   OpenSearch Dashboards   : ${OPENSEARCH_DASHBOARDS_PORT}:5601
#   ClickHouse              : ${CLICKHOUSE_HTTP_PORT}:8123, ${CLICKHOUSE_NATIVE_PORT}:9000
#   Prometheus              : ${PROMETHEUS_PORT}:9090
#   cAdvisor                : ${CADVISOR_PORT}:8080