# docker compose -f docker-compose.yml  -f docker-compose.ollama.yml up -d ollama
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list > /dev/null 2>&1; do sleep 1; done; ollama run gemma4:12b ''; ollama run phi4:14b ''; wait"] # 서버 시작 후 모델 미리 올림
    environment:
      - OLLAMA_HOST=0.0.0.0:${OLLAMA_PORT:?OLLAMA_PORT가 설정되지 않았습니다}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:?OLLAMA_NUM_PARALLEL이 설정되지 않았습니다} # 모델 1개가 동시에 처리하는 요청 수
      - OLLAMA_KEEP_ALIVE=-1 # 로드한 모델을 메모리에서 내리지 않음 (예: 30m이면 30분 동안 호출이 없을 때 모델을 내림)
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - shire-net
    deploy:
      resources:                       # 이 컨테이너에 리소스를 예약(할당)하겠다는 선언
        reservations:                  # 예약할 자원 목록 시작
          devices:                     # 컨테이너에 넘겨줄 디바이스 목록
            - driver: nvidia           # NVIDIA 드라이버를 통해 디바이스에 접근
              count: 1                 # GPU 1개를 할당 (RTX 5090 하나)
              capabilities: [gpu]      # 이 디바이스에게 요구하는 기능은 "gpu" 연산 기능

volumes:
  ollama_data: