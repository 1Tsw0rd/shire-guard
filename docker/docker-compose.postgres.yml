# docker compose -f docker-compose.yml  -f docker-compose.postgres.yml up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB가 설정되지 않았습니다}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER가 설정되지 않았습니다}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 설정되지 않았습니다}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT가 설정되지 않았습니다}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d  # 초기화 폴더 마운트: 정렬된 순서대로 sql 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shire-net